<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff — Send Pickup Link</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 1rem; }
    input, button { width: 100%; padding: 0.75rem; margin: 0.4rem 0; font-size: 1rem; box-sizing: border-box; }
    button { background: #0a5; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button.secondary { background: #444; }
    #result { margin-top: 1rem; padding: 1rem; background: #f0f0f0; border-radius: 8px; white-space: pre-wrap; font-size: 0.85rem; }
    .photo-preview { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
    .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Staff Tools</h1>

  <h2>1. Create Test Order</h2>
  <button class="secondary" onclick="createOrder()">Create Test Local Pickup Order</button>

  <h2>2. Send Pickup Link</h2>
  <label>Order ID / Name<br><input id="orderId" value="TEST-1001"></label>
  <label>Customer phone<br><input id="phone" placeholder="+1289..."></label>
  <label>Name<br><input id="name" value="Alex Rivera"></label>
  <button onclick="send()">Send SMS Link</button>

  <h2>3. Upload Product Photos</h2>
  <p style="font-size:0.9rem;color:#555;">Take photos of the items being handed to the customer. These will be emailed with the certificate.</p>
  <label>Order<br><input id="photoOrder" value="TEST-1001"></label>
  <input type="file" id="photoInput" accept="image/*" capture="environment" multiple onchange="previewPhotos(this)">
  <div id="photoPreviews" class="photo-preview"></div>
  <button onclick="uploadPhotos()">Send Product Photos</button>

  <div id="result"></div>

  <script>
    async function createOrder() {
      const result = document.getElementById('result');
      result.textContent = 'Creating order…';
      try {
        const res = await fetch('/api/create-test-order', { method: 'POST' });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
        if (data.order_name) {
          document.getElementById('orderId').value = data.order_name;
          document.getElementById('photoOrder').value = data.order_name;
        }
      } catch (err) {
        result.textContent = 'Error: ' + err.message;
      }
    }

    async function send() {
      const result = document.getElementById('result');
      result.textContent = 'Sending…';

      const body = {
        orderId: document.getElementById('orderId').value,
        phone: document.getElementById('phone').value,
        name: document.getElementById('name').value
      };

      try {
        const res = await fetch('/api/send-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = 'Error: ' + err.message;
      }
    }

    function previewPhotos(input) {
      const container = document.getElementById('photoPreviews');
      container.innerHTML = '';
      Array.from(input.files).forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        container.appendChild(img);
      });
    }

    async function uploadPhotos() {
      const result = document.getElementById('result');
      const files = document.getElementById('photoInput').files;
      if (!files.length) {
        result.textContent = 'Please select at least one photo.';
        return;
      }

      result.textContent = 'Uploading photos…';

      const photos = [];
      for (const file of files) {
        const dataUrl = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
        photos.push({ name: file.name, data: dataUrl });
      }

      try {
        const res = await fetch('/api/staff-photos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            orderId: document.getElementById('photoOrder').value,
            photos
          })
        });
        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
